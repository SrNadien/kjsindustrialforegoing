plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${author}.${modid}"
base {
    archivesName = "${modname}"
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        systemProperty 'forge.logging.console.level', 'debug'

        //Limit ram usage for the dev environment to 4GB
        jvmArgument '-Xmx4G'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', "${modid}"
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', "${modid}"
        programArgument '--nogui'
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', "${modid}", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        // KubeJS / Rhino
        url = "https://maven.saps.dev/releases"
    }
    maven {
        url = "https://maven.latvian.dev/"
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        // Modrinth's maven only serves the artifacts themselves, no poms/module metadata
        metadataSources {
            artifact()
        }
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoversion}"

    // KubeJS - transitive = false because its POM pins jar-in-jar'd libraries
    // (animated-gif-lib, better-advanced-tooltips) that aren't on any public maven.
    implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }

    // Rhino
    implementation("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }

    // industrial foregoing
    implementation "maven.modrinth:industrial-foregoing:${if_version}"
    implementation "maven.modrinth:titanium:${titanium_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : mcversion,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neoversion,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : modid,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : author,
            mod_description        : mod_description,
            issue_tracker          : issue_tracker,
            if_version             : if_version,
            if_version_range       : if_version_range,
            titanium_version       : titanium_version,
            kubejs_version         : kubejs_version,
            kubejs_version_range   : kubejs_version_range,
            rhino_version          : rhino_version
    ]
    
    inputs.properties replaceProperties
    
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}